name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$VERSION — will build and release."
          fi

  release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — required so the app can verify and auto-install updates.
          # Add ONE repository secret (Settings › Secrets and variables › Actions):
          #   TAURI_SIGNING_PRIVATE_KEY → contents of ~/.tauri/codeflow-updater.key
          # The key was generated without a password, so the password is an empty string.
          # (If you later regenerate the key WITH a password, move this to a secret instead.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ needs.check-version.outputs.version }}
          releaseName: CodeFlow v${{ needs.check-version.outputs.version }}
          releaseBody: See the commit history for what changed in this release.
          # Published (not draft) so the updater's `releases/latest/download/latest.json`
          # endpoint can resolve — draft releases aren't served there.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
