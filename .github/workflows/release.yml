name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

# Two runs of this workflow must never overlap. They no longer *race* — every write to the release
# object happens in a single job now (see `create-release` and `updater-json`) — but two dispatches
# of the same version would still be two builds uploading to one draft, and queueing them is free.
# `cancel-in-progress: false`: a half-cancelled release leaves a draft with one platform's bundles
# in it, which is exactly the state this restructure exists to make impossible.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should-release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists — skipping release."
          else
            echo "should-release=true" >> "$GITHUB_OUTPUT"
            echo "New version v$VERSION — will build and release."
          fi

      # The release body isn't only read on the Releases page: the updater publishes it as the
      # `notes` field of `latest.json`, and the app shows it in its "What's new" window when it
      # finds this version. So it's built from the commits since the previous tag.
      - id: notes
        if: steps.check.outputs.should-release == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          # The tag for this version doesn't exist yet (the step above just checked), so the
          # newest tag is the previous release. Empty on the very first one, which the
          # generator handles by walking the whole history.
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "Previous tag: ${PREV:-<none>}"
          {
            echo "notes<<CF_RELEASE_NOTES_EOF"
            PREV="$PREV" node .github/scripts/release-notes.cjs
            echo "CF_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # The single writer of the release object, so that the two builds below can run at the same time.
  #
  # This job exists because the matrix used to be `max-parallel: 1`, and the reason it was is worth
  # keeping: run `tauri-action` on two runners at once and both look up the tag, both find it
  # missing, and both try to create it — the loser dies with "Validation Failed:
  # tag_name already_exists". Serializing fixed that at the cost of the whole point of a matrix:
  # wall clock became the *sum* of a Windows build and a macOS one.
  #
  # Both races are opt-out in the pinned action. `tauri-action`'s `src/index.ts` guards release
  # creation with `if (tagName && !releaseId)`, so a job handed a `releaseId` never touches the tag;
  # and it guards the `latest.json` read-modify-write with `if (includeUpdaterJson)`, which the
  # builds below turn off. The `.sig` files are collected by `src/build.ts` unconditionally and
  # uploaded as ordinary assets either way, which is what lets `updater-json` rebuild that file
  # once, at the end, from both platforms at once.
  #
  # Draft, and deliberately: a draft carries no git tag, so a run that dies half-way leaves nothing
  # for `check-version` to trip over on the retry, and `releases/latest/download/latest.json` goes
  # on resolving to the *previous* release for as long as this one is incomplete — rather than to a
  # release that only has one platform in it. `updater-json` is what publishes.
  #
  # Idempotent by tag: a re-run finds the existing draft and reuses its id instead of opening a
  # second release.
  create-release:
    needs: check-version
    if: needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.mk.outputs.release-id }}
    steps:
      - id: mk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ needs.check-version.outputs.version }}
          RELEASE_NAME: CodeFlow v${{ needs.check-version.outputs.version }}
          NOTES: ${{ needs.check-version.outputs.notes }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `gh api` rather than `gh release view`: a draft has no tag, so it is only findable by
          # its `tag_name` field through the API.
          #
          # `awk 'NR==1'` and not `head -n1`, here and everywhere below. `head` closes the pipe
          # after one line, `gh` takes SIGPIPE and exits 141, and `pipefail` turns that into a
          # failed step — but only once the output is large enough to fill the pipe buffer, which
          # is to say only once this repository has accumulated enough releases. `awk` drains it.
          id=$(gh api --paginate "/repos/$REPO/releases" \
                 --jq ".[] | select(.tag_name==\"$TAG\") | .id" | awk 'NR==1')
          if [ -z "$id" ]; then
            jq -n --arg t "$TAG" --arg n "$RELEASE_NAME" --arg b "$NOTES" --arg s "$SHA" \
              '{tag_name:$t,name:$n,body:$b,target_commitish:$s,draft:true,prerelease:false}' \
              > payload.json
            id=$(gh api -X POST "/repos/$REPO/releases" --input payload.json --jq .id)
            echo "Created draft release $id for $TAG"
          else
            echo "Reusing existing release $id for $TAG"
          fi
          echo "release-id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: [check-version, create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # No `max-parallel`. Neither of the two races that forced it is reachable any more: the tag
      # is created once, by `create-release` above, and `latest.json` is written once, by
      # `updater-json` below. See the long note on `create-release` for the mechanism. This is
      # where the release stops taking as long as both builds put together.
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # Apple Silicon only, and deliberately not `universal-apple-darwin`: the app bundles a
          # Java runtime for the IRIS driver, and `jlink` builds a runtime for exactly one
          # architecture. A universal Rust binary paired with an arm64 JRE would install fine on an
          # Intel Mac and then fail the moment an IRIS connection was opened — a broken feature is
          # worse than an absent build.
          - platform: macos-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Needed to *build* the app, never to run it: `pnpm iris:runtime` uses javac/jar/jlink to
      # produce the trimmed Java runtime that ships inside the installer for the IRIS driver.
      # Pinned rather than left to whatever the runner image happens to preinstall, because the
      # runtime that reaches users is whatever version this step provides.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned, not `@stable`. `rust-cache` keys its cache on the compiler's version, so a floating
      # toolchain means that the day Rust ships a release — every six weeks, on a schedule nobody
      # here chooses — the key changes on *both* runners at once and all 757 crates in the lockfile
      # rebuild from zero. That is what turned the Windows job from 11 minutes into 26 on v1.13.4:
      # the cache keys flipped from `…-8af1e26a-…` to `…-af4551b0-…` on the same day the macOS ones
      # flipped, while the dependency hash never moved.
      #
      # Bumping this is a deliberate act that costs one cold build, which is the trade: one slow
      # release you chose over a surprise one you didn't. It also makes the published binary
      # reproducible, which `@stable` never was.
      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Pinned rather than derived. With neither `shared-key` nor `key`, rust-cache appends
          # `GITHUB_JOB` to its prefix (`add-job-id-key` defaults to true), so the key is literally
          # `v0-rust-release-<os>-<arch>-<env hash>-<lockfile hash>` — and renaming or splitting
          # this job silently invalidates both platforms' caches, sending the next release into a
          # cold 769-crate build that nothing in the diff explains. "release" is the name the job
          # has today, so writing it down costs nothing now and stops costing 26 minutes later.
          shared-key: release
          # A leg that fails at minute 20 has still compiled ~700 dependencies, and the default
          # (`post-if: success()`) throws every one of them away — so the retry starts from zero,
          # which is the most expensive thing that can happen to this pipeline. The entries are
          # keyed by lockfile and compiler, so saving them after a failure in *this app's* code
          # cannot poison anything.
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # `jlink` and `javac` cost between 20 seconds and 2.5 minutes on a cold runner, to produce
      # something whose inputs change about once a year.
      #
      # Both paths, not just the one that ships: the script's "already current" checks read stamp
      # files it deliberately keeps *outside* `resources/iris`, because that directory is copied
      # verbatim into the bundle and a build stamp has no business reaching users. Restore the
      # runtime without its stamp and the script rebuilds it anyway — the cache would cost time
      # rather than save it.
      #
      # No `restore-keys`. A near-miss would hand the script a runtime built from different inputs,
      # and while its stamp check would catch that and rebuild, this directory is the one that ends
      # up inside an installer — an exact match or nothing is the right bargain here.
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/resources/iris
            src-tauri/target/iris-build
          # `jlink` emits a runtime for whatever platform ran it, so the OS is part of the identity,
          # and so is the JDK that `setup-java` above pins. The script carries the driver's version
          # and its pinned checksum and the module list, so hashing the script covers all three;
          # `src-tauri/java` is the bridge's own source.
          key: iris-runtime-${{ runner.os }}-jdk17-${{ hashFiles('scripts/build-iris-runtime.mjs', 'src-tauri/java/**') }}

      # `tauri build` runs this again through `beforeBuildCommand`, where it is an incremental
      # no-op. Doing it here first is for the log: when the Java toolchain is the thing that broke,
      # this step fails on its own line instead of somewhere inside a ten-minute Rust build.
      - run: pnpm iris:runtime

      # tauri downloads the WiX and NSIS toolchains into the user cache directory the first time it
      # packages, and a hosted runner is new every time — so without this, every Windows release
      # re-fetches both before it can start bundling. Keyed on the lockfile because that is what
      # pins the tauri CLI, which is what decides which toolchain build it wants. A stale entry
      # costs only the download it was meant to save.
      - if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-bundler-tools-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: tauri-bundler-tools-${{ runner.os }}-

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `beforeBuildCommand` runs `vite build`, which peaks well above Node's default heap on
          # the macOS runner — it died at ~2 GB there with "Ineffective mark-compacts near heap
          # limit". The runner has 7 GB, so 4 GB is headroom without risking swap. Raise this if
          # the bundle grows a lot.
          #
          # It used to be Monaco in a ~20 MB entry chunk that did it. Since v1.14.13 the entry is
          # ~1.4 MB and the weight lives in lazily-imported chunks instead, but the peak is a
          # minifier working on the largest single chunk — now `@dbml/core` at ~15.6 MB — so the
          # ceiling still has to clear it.
          NODE_OPTIONS: --max-old-space-size=4096
          # Updater signing — required so the app can verify and auto-install updates.
          # Add ONE repository secret (Settings › Secrets and variables › Actions):
          #   TAURI_SIGNING_PRIVATE_KEY → contents of ~/.tauri/codeflow-updater.key
          # The key was generated without a password, so the password is an empty string.
          # (If you later regenerate the key WITH a password, move this to a secret instead.)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # `tagName` / `releaseName` / `releaseBody` / `releaseDraft` / `prerelease` are absent on
          # purpose rather than by omission: `src/index.ts` ignores every one of them once
          # `releaseId` is set, and leaving them here would read as if they still governed
          # something. `create-release` above owns all of it.
          releaseId: ${{ needs.create-release.outputs.release-id }}
          # The other half of what makes this matrix parallel. With this on, each leg would
          # download `latest.json`, merge its own platform into it and re-upload — a read-modify-
          # write with two writers, where the loser's platform silently vanishes and half the users
          # stop receiving updates. The `.sig` files are uploaded as ordinary assets regardless
          # (`src/build.ts` collects them unconditionally), and `updater-json` below assembles that
          # file once, from both.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # The one thing no unit test can check: that the Java runtime actually made it *inside* what
      # was built. Everything upstream can pass while a `bundle.resources` change quietly drops it,
      # and the symptom would be an installer that looks fine until a user opens an IRIS connection.
      # Cheap enough to run on every release, and it fails the job rather than leaving that to them.
      - name: Verify the IRIS runtime shipped inside the bundle
        shell: bash
        run: |
          set -euo pipefail
          found=$(find src-tauri/target -type f \
            \( -name java -o -name java.exe \) -path '*iris/runtime/bin/*' | head -n1 || true)
          if [ -z "$found" ]; then
            echo "::error::The bundled Java runtime is missing — this installer would ship an IRIS engine that cannot connect."
            find src-tauri/target -maxdepth 6 -type d -name iris || true
            exit 1
          fi
          echo "Bundled runtime: $found"
          du -sh "$(dirname "$(dirname "$found")")"

  # The single writer of `latest.json`, and the only thing in this workflow that publishes.
  #
  # It replaces what `tauri-action` used to do per platform — download the file, merge one platform
  # into it, upload it again — which is a read-modify-write and therefore the second reason the
  # matrix had to be serialized. Rebuilt here from the `.sig` assets both legs uploaded, so there is
  # no previous content to merge with and nothing that can be lost.
  #
  # `needs: release` with no `always()`, deliberately: if either platform failed, this does not run,
  # the release stays a draft, no tag is created, and `releases/latest/download/latest.json` goes on
  # serving the previous release. A user sees nothing at all, which is the correct outcome — the
  # alternative, and what the old design risked, is an update manifest that names one platform.
  updater-json:
    needs: [check-version, create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Assemble latest.json and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
          TAG: v${{ needs.check-version.outputs.version }}
          VERSION: ${{ needs.check-version.outputs.version }}
          NOTES: ${{ needs.check-version.outputs.notes }}
        run: |
          set -euo pipefail

          gh api --paginate "/repos/$REPO/releases/$RELEASE_ID/assets" \
            --jq '.[] | [.id, .name] | @tsv' > assets.tsv
          mkdir -p sigs
          while IFS=$'\t' read -r id name; do
            case "$name" in
              *.sig) gh api -H "Accept: application/octet-stream" \
                       "/repos/$REPO/releases/assets/$id" > "sigs/$name" ;;
            esac
          done < assets.tsv
          ls -la sigs || true

          # Reproduces `tauri-action`'s own mapping (src/upload-version-json.ts) for the two targets
          # this repo builds, and nothing else. Three details are load-bearing:
          #
          #  · It emits both the bare `<os>-<arch>` key and the `<os>-<arch>-<bundle>` one, because
          #    that is what the action emits and what an installed updater is already looking for.
          #  · `prio` stands in for the action's `signaturePriority`. With `updaterJsonPreferNsis`
          #    unset its order puts `.msi.sig` ahead of `.exe.sig`, so the bare `windows-x86_64` key
          #    resolves to the MSI. Flip that and every Windows user's next auto-update silently
          #    changes installer format. The numbers are ours; the ordering is the action's.
          #  · The URL is built from the tag rather than from `browser_download_url`, because a
          #    draft's asset URLs carry an `untagged-…` segment. The action rewrites it the same way.
          echo '{}' > platforms.json
          for sig in sigs/*.sig; do
            [ -e "$sig" ] || { echo "::error::no updater signatures on the release"; exit 1; }
            target=$(basename "$sig" .sig)
            case "$target" in
              *.app.tar.gz) key=darwin-aarch64;  bundle=app;  prio=0   ;;
              *.msi)        key=windows-x86_64;  bundle=msi;  prio=100 ;;
              *-setup.exe)  key=windows-x86_64;  bundle=nsis; prio=99  ;;
              # Anything else is warned about rather than guessed at. The v1-era `.msi.zip.sig` /
              # `.nsis.zip.sig` wrappers land here, and pointing a v2 updater at a .zip would break
              # updates far more quietly than skipping it does — the gate below then fails the job.
              *) echo "::warning::unmapped signature $target.sig"; continue ;;
            esac
            url="https://github.com/$REPO/releases/download/$TAG/$target"
            # `--rawfile`, not `$(cat)`: the action does `readFileSync(...).toString()`, and a
            # signature that differs by one byte of trailing whitespace is one that fails to verify.
            jq --arg k "$key" --arg b "$bundle" --arg u "$url" --argjson p "$prio" --rawfile s "$sig" \
               '.[$k + "-" + $b] = {signature:$s, url:$u}
                | if ((.[$k].prio // -1) < $p) then .[$k] = {signature:$s, url:$u, prio:$p} else . end' \
               platforms.json > platforms.next && mv platforms.next platforms.json
          done
          jq 'with_entries(.value |= del(.prio))' platforms.json > platforms.clean

          jq -n --arg v "$VERSION" --arg n "$NOTES" \
                --arg d "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
                --slurpfile p platforms.clean \
                '{version:$v, notes:$n, pub_date:$d, platforms:$p[0]}' > latest.json

          # The gate the serialized design never had, and the reason this is worth doing at all:
          # half a latest.json is worse than none, because the missing platform stops receiving
          # updates and nothing anywhere goes red.
          for key in darwin-aarch64 windows-x86_64; do
            jq -e --arg k "$key" '.platforms[$k].signature | length > 0' latest.json >/dev/null \
              || { echo "::error::latest.json is missing $key"; jq 'del(.platforms[].signature)' latest.json; exit 1; }
          done
          jq 'del(.platforms[].signature)' latest.json

          # Replace, never merge — there is exactly one writer, so there is nothing to merge with.
          old=$(gh api --paginate "/repos/$REPO/releases/$RELEASE_ID/assets" \
                  --jq '.[] | select(.name=="latest.json") | .id' | awk 'NR==1')
          [ -z "$old" ] || gh api -X DELETE "/repos/$REPO/releases/assets/$old"
          gh api --method POST -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=latest.json" \
            --input latest.json

          # Only now does the release exist for users, and it exists complete: every bundle, both
          # signatures, and a manifest already proven to name both platforms. This is where the old
          # `releaseDraft: false` comment's requirement is met — `releases/latest/download` does not
          # serve drafts, so nothing may stay one, and nothing does past this line.
          gh api -X PATCH "/repos/$REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true

  # Keeps the repository under GitHub's 10 GB Actions cache quota.
  #
  # `rust-cache` writes a new entry whenever its key changes and never removes the old one, so the
  # generations pile up: at v1.13.4 there were twelve entries totalling 11.23 GB — three macOS
  # generations at ~1.96 GB and three Windows ones at ~1.23 GB, all for compilers and lockfiles no
  # build will ask for again. Over the quota GitHub evicts by least-recently-used, which means the
  # entry it throws away is occasionally the one the next release needed, and that release pays for
  # a full cold build with no Rust upgrade to explain it.
  #
  # Runs after the builds rather than on a schedule, because that is the moment a new generation was
  # just written and the old one became dead — a weekly sweep would leave the repo over quota for
  # most of the week.
  prune-caches:
    needs: [check-version, release, updater-json]
    # `always()`: with `cache-on-failure: true` on the matrix, a leg that failed *did* save a cache
    # on its way out — and this is housekeeping, so it should run whether or not the release itself
    # went through. `updater-json` is in `needs` only for ordering; `always()` means its own failure
    # does not skip the sweep.
    if: always() && needs.check-version.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    # Never the reason a release run goes red. Nothing downstream depends on this having worked.
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Drop superseded Rust caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # Per platform: the newest is the exact match the next build wants, and the one behind it
          # is what `rust-cache`'s restore-keys fall back to when `Cargo.lock` moves — which turns a
          # dependency bump from a cold build into a warm one. Two is the whole reason to keep more
          # than one; a third has never been restored by anything.
          KEEP: "2"
        shell: bash
        run: |
          set -euo pipefail
          # Only the Rust caches. The `node-cache-*` entries are ~60 MB each and belong to
          # `setup-node`, which manages its own; deleting those would be meddling for no space.
          gh api --paginate "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("v0-rust-")) | [.created_at, .id, .key] | @tsv' \
            | sort -r \
            | awk -v keep="$KEEP" -F'\t' '
                {
                  # The key is `…-<env hash>-<lockfile hash>`; dropping both leaves the platform,
                  # which is the thing there should be one live generation of.
                  group = $3
                  sub(/-[^-]*-[^-]*$/, "", group)
                  if (++seen[group] > keep) print $2 "\t" $3
                }
              ' \
            | while IFS=$'\t' read -r id key; do
                echo "deleting $key"
                gh api -X DELETE "/repos/${REPO}/actions/caches/${id}" >/dev/null || \
                  echo "::warning::could not delete cache $key"
              done
          # What is left, in the log — so the next person who wonders where the quota went can read
          # it off a release run instead of going to the API.
          echo "--- remaining ---"
          gh api --paginate "/repos/${REPO}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | "\((.size_in_bytes/1048576)|floor) MB  \(.key)"'
