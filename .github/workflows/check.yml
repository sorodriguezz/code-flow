# The cheap half of a test gate, for pull requests — and, since v1.18.6, only for pull requests.
#
# It used to trigger on pushes to `main` too, and that is where the noise came from: a version bump
# is a push to `main`, so every release produced two runs of the same commit — this two-minute
# typecheck and the twenty-minute release beside it, neither aware of the other. The checks now
# also live in `release.yml` as its `verify` job, where they gate the builds that actually cost
# something. So: a pull request gets this, a release gets the same checks inside its own run,
# and a push to `main` that releases nothing runs nothing at all.
#
# What follows is the other half of the reasoning, unchanged — why this is the cheap half only.
#
# What is here runs on Ubuntu in about two minutes with no Rust toolchain: a TypeScript typecheck
# and a translation-key parity check. Between them they catch the two regressions this repository
# actually produces — a type error that would otherwise surface twenty minutes into the release job
# on a Windows runner, and an English string added without its Spanish twin. A byte scan rides
# along for a rarer one that hides itself: a control byte typed into source, where a single NUL
# makes git show the whole file as binary. The vitest suite runs next: the frontend's stores and
# pure logic, in seconds, still with no Rust toolchain.
#
# Last, the third-party notices: `THIRD-PARTY-NOTICES.md` regenerated in memory and compared byte
# for byte with the committed copy, so a dependency cannot land without its licence row. It is the
# one step that calls cargo, and only `cargo metadata` — it reads `Cargo.lock` and downloads crate
# manifests but compiles nothing, so the cargo already on the Ubuntu image is all it needs.
#
# What is NOT here, and why: `cargo test`.
#
#   * On `ubuntu-latest`, the obvious cheap runner, this crate has never been built. The release
#     matrix is Windows and macOS only, `vendored-openssl` is scoped to macOS so git2 would need
#     libssl-dev and pkg-config, `keyring 3` selects `windows-native`/`apple-native` per platform
#     and has no Linux backend chosen, and Tauri needs webkit2gtk and libsoup development packages.
#     That is an unknown number of days porting to a platform nobody ships, and every breakage found
#     would be a breakage no user can have.
#   * On `macos-latest` or `windows-latest` it is a 10-25 minute debug build per pull request — the
#     release workflow's own comments record 11 minutes warm and 26 cold — and macOS runner minutes
#     bill at ten times the Linux rate.
#
# `cargo test --lib` is run by hand — before a release, and before a pull request (CONTRIBUTING.md
# asks for it, against a baseline of zero failures). If that ever stops being enough, the place to
# add it is a step inside the existing release job, where the toolchain and `rust-cache` are already
# warm — not a second job that pays for both from cold.

name: check

on:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts`: nothing here builds or runs the Tauri app, and the postinstall steps of
      # a desktop toolchain are the slowest part of an install that otherwise takes seconds.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Before `tsc`, because it is the faster of the two and its failure is the more common one —
      # and because reading "you forgot the Spanish string" is more useful than reading the type
      # error that same omission produces.
      - run: node scripts/check-translations.mjs

      # A NUL, ESC or Ctrl-C typed into source where its escape belonged. `tsc` cannot object — the
      # string is the same either way — but one NUL is enough for git to diff the whole file as
      # binary, hiding every change to it from review.
      - run: node scripts/check-control-bytes.mjs

      - run: pnpm exec tsc --noEmit

      # The frontend suite. It needs neither the Rust toolchain nor a webview and finishes in
      # seconds, which is exactly why leaving it out was a mistake: for a long stretch nothing ran
      # these tests anywhere but a developer's machine, so a green check said nothing about them.
      - run: pnpm exec vitest run

      # The notices file against the tree it describes. Works from the lockfiles and the installed
      # `node_modules`; cargo fetches the crate manifests on a cold runner, which is why this is not
      # `--offline` here. A failure means "run `pnpm notices` and commit the file".
      - run: node scripts/build-third-party-notices.mjs --check
