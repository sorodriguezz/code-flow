<!doctype html><html><head><meta charset="utf-8"><style>
:root{
  --cf-bg: #f7f7fb;
  --cf-surface: #ffffff;
  --cf-surface-raised: #ffffff;
  --cf-border: #e7e7ef;
  --cf-text: #1c1c26;
  --cf-text-muted: #6b6b7d;
  --cf-accent: #6366f1;
  --cf-accent-soft: color-mix(in oklab, var(--cf-accent) 14%, var(--cf-surface));
  /* A field has to read as a field on both surfaces it lands on — the white panels, where a white
     fill alone says nothing, and the tinted cards, where a transparent one said nothing at all. So
     the border does most of the work and is deliberately darker than `--cf-border`: that one is
     tuned for dividing regions, and a divider's weight is too quiet for the edge of something you
     are meant to type into. */
  --cf-field: #ffffff;
  --cf-field-border: #cfcfdd;
  --cf-success: #16a34a;
  --cf-danger: #dc2626;
  --cf-warning: #d97706;
  /* The violet the schema canvas draws an enum and a `unique` column in. Its own token because it
     has to be the one colour on that canvas the accent can never become — an enum drawn in the
     accent is indistinguishable from a table the moment somebody picks Purple — and because, like
     every other colour here, it has to be two values: a shade that carries white text on the light
     theme and a lighter one that carries dark text on the dark. Same pair as the accent picker's
     Purple, so the two never look like different purples. */
  /* The blue a foreign key is badged in on the schema canvas, beside the amber of a primary key and
     the violet of a unique column. Three fixed hues rather than three accent-derived ones, and that
     is deliberate even though the rest of that canvas follows the accent: the badges sit *next to
     each other on one row*, so what they have to be is distinct from each other. Tied to the accent,
     FK and unique were the same colour on the default indigo, and FK and PK were the same colour the
     moment somebody picked Amber. The accent still draws the headers, the lines, the glow and the
     selection — the badges are a legend, and a legend has fixed colours. */
  --cf-violet: #9333ea;
  --cf-blue: #2563eb;
  /* BSON value colours for the document list. Their own tokens rather than borrowed semantics:
     `--cf-danger` happens to be the right red for an ObjectId today, and the day someone retunes
     what "danger" means, every id in every document would move with it. Chosen to sit at similar
     weight so no one type shouts over the others in a document read top to bottom. */
  --cf-bson-string: #0f7a4d;
  --cf-bson-number: #1d4ed8;
  --cf-bson-id: #b45309;
  --cf-bson-date: #7c3aed;
  --cf-bson-literal: #9333ea;
  /* Mixed halfway into the surface rather than used at full strength: the bar spans the whole
     window and never changes, so at full saturation three hues of it were the loudest thing on
     screen permanently — chrome outshouting the content it frames. Halved, the identity survives
     and the accent is free to mean something again where it does carry information. */
  --cf-titlebar-gradient: linear-gradient(
    120deg,
    color-mix(in oklab, #c9e9e6 50%, var(--cf-surface)) 0%,
    color-mix(in oklab, #d8c9ec 50%, var(--cf-surface)) 45%,
    color-mix(in oklab, #f3c9d8 50%, var(--cf-surface)) 100%
  );
  --cf-shadow: 0 1px 2px rgba(20, 20, 40, 0.04), 0 8px 24px rgba(20, 20, 40, 0.06);
  /* Same hue family as the titlebar gradient, just as faint washes rather than a solid
     band — the ambient background behind Graph/Changes/Editor (see .cf-ambient-bg below). */
  --cf-ambient-1: color-mix(in oklab, #6fd0c8 20%, transparent);
  --cf-ambient-2: color-mix(in oklab, #b79ae8 18%, transparent);
  --cf-ambient-3: color-mix(in oklab, #f0a8c4 16%, transparent);}
[data-theme="dark"]{
  --cf-bg: #16161d;
  --cf-surface: #1e1e27;
  --cf-surface-raised: #262632;
  --cf-border: #313140;
  --cf-text: #eceef5;
  --cf-text-muted: #9797ab;
  --cf-accent: #818cf8;
  --cf-accent-soft: #2a2a44;
  /* Dark fields go darker than the surface, not lighter — a well rather than a raised tile, which
     is the direction a dark UI reads as "recessed, put text here". Same reasoning as the light
     theme's note. */
  --cf-field: #131320;
  --cf-field-border: #3d3d50;
  --cf-success: #4ade80;
  --cf-danger: #f87171;
  --cf-warning: #fbbf24;
  --cf-violet: #c084fc;
  --cf-blue: #60a5fa;
  /* Same five, lifted for a dark background — see the light theme's note. */
  --cf-bson-string: #6ee7a8;
  --cf-bson-number: #93b4fd;
  --cf-bson-id: #fbbf5c;
  --cf-bson-date: #c4a2fb;
  --cf-bson-literal: #d8a2fb;
  /* Same halving as the light theme — see the note there. */
  --cf-titlebar-gradient: linear-gradient(
    120deg,
    color-mix(in oklab, #163a3a 50%, var(--cf-surface)) 0%,
    color-mix(in oklab, #2a2148 50%, var(--cf-surface)) 45%,
    color-mix(in oklab, #3a1f30 50%, var(--cf-surface)) 100%
  );
  --cf-shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.4);
  --cf-ambient-1: color-mix(in oklab, #2dd4c4 16%, transparent);
  --cf-ambient-2: color-mix(in oklab, #8b6fd9 16%, transparent);
  --cf-ambient-3: color-mix(in oklab, #d9527d 12%, transparent);}
html,body{margin:0;height:100%}
body{background:var(--cf-bg);color:var(--cf-text);font-family:Inter,-apple-system,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
svg{display:block}
