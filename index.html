<!doctype html>
<!-- `lang` is the first frame's only: `languageStore` rewrites it to the language on screen (the
     user's choice, or the system's on a first run), which is what screen readers pick a voice by. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/codeflow.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeFlow</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
