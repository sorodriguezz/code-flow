allowBuilds:
  esbuild: true

# Security floors for packages other dependencies pin exactly (Revisor › Dependencias, 2026-10-24).
# Each one is the patched release on the same API (the last three only lift a floor pnpm update
# wouldn't move inside an unchanged range): monaco pins dompurify, chevrotain pins lodash-es,
# excalidraw pins nanoid 3 and mermaid-to-excalidraw nanoid 4, and mermaid asks for katex ^0.16 —
# it renders MathML, and the app already loads katex 0.19's stylesheet.
overrides:
  dompurify@<3.4.17: ^3.4.17
  lodash-es@<4.18.0: ^4.18.1
  nanoid@<3.3.18: ^3.3.18
  '@excalidraw/mermaid-to-excalidraw>nanoid': ^5.1.16
  mermaid>katex: 0.19.0
  browserslist@<4.28.7: ^4.28.7
  postcss@<8.5.23: ^8.5.23
  source-map-js@<1.2.2: ^1.2.2

# The terminal's WebGL renderer drew every cell carrying a background *flag* (dim, an underline
# style, a link) as an opaque rectangle of the theme background with its alpha forced to 1 — on the
# see-through terminal (`#00000000`) that is a black box behind dimmed text and restored scrollback.
# The patch keeps the theme background's own alpha for default-background cells; explicit and
# inverse colours stay opaque. Drop it once xterm fixes `RectangleRenderer._updateRectangle`.
patchedDependencies:
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
