[package]
name = "codeflow"
version = "0.1.0"
description = "CodeFlow — visual git client + AI PR reviewer"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codeflow_lib"
# `rlib` only — not the `["staticlib", "cdylib", "rlib"]` the tauri template starts with.
#
# `staticlib` is what an iOS build links and `cdylib` is what an Android build loads. There is no
# `gen/apple` and no `gen/android` in this repo, and the only mobile reference in 92,000 lines of
# Rust is an inert `#[cfg_attr(mobile, …)]` in `lib.rs`, so both were being produced for nobody.
#
# They are not free extras. The 769 dependencies are built once as rlibs and shared either way —
# that part is unchanged — but each additional crate type is another *link product*, so each adds
# its own link, and under `lto = "thin"` below its own LTO pass, on top of the one `main.rs`
# actually needs. The staticlib is the expensive one by far: a ~1 GB archive written out and read
# back on every build. The cdylib exports nothing, so the linker discards almost all of it.
#
# `main.rs` is `fn main() { codeflow_lib::run() }` and links the rlib, so the shipped binary comes
# out of exactly the same path as before. Put the other two back the day someone runs
# `tauri android init` / `tauri ios init` — with them, not before.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `tauri::test::mock_app`, used by exactly one test — `remotectl::bridge::tests`, which verifies
# that `Emitter::emit` reaches a Rust listener registered with `listen_any` and not only the
# webviews.
#
# That is the single runtime assumption the remote-control feature rests on: it is how a phone sees
# a live agent run at all. Everything else in that module is pure enough to test directly, but this
# one is a claim about Tauri's delivery semantics, and the only honest way to check a claim about a
# framework is to run it. Without this the failure mode is silent and misleading — RPC calls work,
# pairing works, and the event stream is simply empty forever.
tauri = { version = "2", features = ["test"] }

# Release builds are optimized for how the app actually feels, not for how long CI takes: cross-crate
# inlining is what lets the hot paths (git2 diffing, the PTY read loop, JSON (de)serialization on
# every IPC call) stop paying a call through a crate boundary per iteration.
#
# DO NOT add `panic = "abort"`. Several places deliberately survive a panic that happened on another
# thread, and they can only do that because unwinding leaves a *poisoned* lock behind instead of
# killing the process: the terminal reader skips the transcript append when the flush thread
# panicked (`terminal.rs`, the `if let Ok(mut recorded) = transcript.lock()` in the read loop), and
# `secrets.rs` / `git/lock_rules.rs` recover the data with `unwrap_or_else(|e| e.into_inner())`.
# With `panic = "abort"` every one of those becomes a process kill — which, for an app whose whole
# point is that agent runs and terminals keep living in the tray after the window closes, means
# silently losing the user's background work.
[profile.release]
# `thin`, not `fat`, and no `codegen-units = 1`. Both of those were tried on v1.14.13 and took the
# Windows release job past 29 minutes on their own.
#
# The reason is the shape of this dependency graph rather than anything about the app: 757 crates,
# several of which build C (rusqlite ships SQLite, git2 ships libgit2), plus reqwest+rustls,
# tonic/prost, mongodb, tiberius, tokio-postgres and russh-sftp. `codegen-units = 1` removes the
# parallelism *within* every one of those crates, and `lto = "fat"` is a single-threaded
# whole-program pass over the lot at link time — a pass that depends on the final binary, so
# `rust-cache` can never restore it and every release pays it again from scratch.
#
# `thin` keeps the part that actually matters here (cross-crate inlining) while running in
# parallel and incrementally. The measured-in-anger difference between thin and fat on a graph
# like this one is small; the difference in build time is not.
#
# Deliberately NOT `panic = "abort"`: there are places that recover from a poisoned mutex (see
# `terminal.rs`) and one that catches a panic while flushing, and all of them need unwinding.
lto = "thin"
strip = "symbols"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
# Battery level for the status bar. Pure Rust across macOS/Windows/Linux (IOKit / Win32 /
# `/sys/class/power_supply`), so reading it costs no subprocess — which matters on Windows, where
# every console-mode child flashes a window (see `proc.rs`).
starship-battery = "0.11"
# CPU / memory / disk for the status bar, and this app's own share of them. Same bargain as the
# battery above: native readings (host_statistics + libproc on macOS, the PDH/NT APIs on Windows,
# /proc on Linux), so a poll every few seconds costs no subprocess. Only the two facets that are
# drawn — `network`, `component` (thermals) and `user` are default features this never reads, and
# each one is work every refresh would otherwise do.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
# Windows answers `canonicalize` with a verbatim path (`\\?\C:\…`), and Rust reads that form
# happily enough that it travels the whole app unnoticed — until it reaches a consumer that isn't
# Rust. See `paths::set_resource_dir`. This is the crate tauri itself uses to undo that prefix, and
# it is already in the tree as a dependency of tauri's.
dunce = "1"
portable-pty = "0.8"
notify = "6"
open = "5"
# Deleting from the explorer goes to the OS trash rather than to `remove_dir_all`. A tree row is an
# easy thing to click by accident, and "undo" for a folder that is gone from disk is the user's
# backup — this makes it the Finder/Explorer they already know.
trash = "5"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    # The API client needs the transport features the PR/VCS clients never did: file uploads
    # (`multipart`), streaming request bodies (`stream`), manual redirect control and the
    # content encodings a real server will negotiate if we advertise them.
    "multipart",
    "stream",
    "gzip",
    "brotli",
    "deflate",
] }
base64 = "0.22"
regex = "1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.33"
# Only for the `verify_ssl = false` path: `Connector::Rustls` wants an `Arc<rustls::ClientConfig>`
# and tokio-tungstenite doesn't re-export the crate to build one. Pinned to the same feature set
# reqwest already resolves (ring, no aws-lc-rs) — enabling a second crypto provider would make
# `ClientConfig::builder()` panic at runtime for want of a process default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# A database connection can name a private CA and a client certificate; these read the PEM files
# and the OS trust store to build the `rustls::ClientConfig` that results. Both versions are already
# in the tree as transitive dependencies of the drivers — naming them here only makes them ours to
# call directly.
rustls-pemfile = "2"
rustls-native-certs = "0.8"
globset = "0.4.19"

# ---------------- API client ----------------
# The built-in Postman-style client needs a transport per protocol plus the primitives to sign
# requests itself (Digest and AWS SigV4 are challenge/canonical-form schemes that can't be
# expressed as a static header, so they can't be done in the webview).
url = "2"
percent-encoding = "2"
bytes = "1"
tokio-stream = "0.1"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.9"
rumqttc = "0.24"

# ---------------- Full backup ----------------
# The whole-install backup is sealed in Rust rather than in the webview: the payload is the entire
# configuration plus every credential in the OS store, and pushing megabytes of it across the IPC
# bridge to be encrypted by WebCrypto would cost two JSON round trips and a base64 copy for no gain.
#
# Argon2id (not PBKDF2) because this passphrase is the only thing standing between a file the user
# is about to put in Google Drive and every token they own: memory-hardness is what makes a GPU
# attack cost something. AES-256-GCM seals it, and the header travels as the AAD so the KDF
# parameters can't be edited down without the tag failing.
aes-gcm = { version = "0.10", features = ["std"] }
argon2 = "0.5"
# Pure-Rust deflate (miniz_oxide): the payload is highly repetitive JSON, and compressing before
# encrypting is what keeps a several-megabyte configuration a few hundred kilobytes in the cloud.
flate2 = "1"
# Wipes the derived key and the decrypted plaintext once they've served their purpose, so a
# passphrase-derived key doesn't linger in freed memory for the rest of the session.
zeroize = "1"
# gRPC without a `protoc` binary on the user's machine: `protox` is a pure-Rust .proto compiler
# producing a FileDescriptorSet, `prost-reflect` turns that into dynamic messages at runtime, and
# `tonic` carries them over the wire through a hand-written codec (there is no generated stub —
# the service isn't known until the user picks a .proto or the server answers reflection).
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.9"

# ---------------- Database client ----------------
# One driver per engine, and four of the five are pure Rust: the app installs nothing on the user's
# machine, so there is no ODBC manager and no vendor client library to make a prerequisite.
#
# IRIS is the exception, and it costs no crate. It has no Rust driver and no third-party
# implementation of its superserver protocol, so `datasource::iris` drives the InterSystems JDBC
# driver through a small Java sidecar (`src-tauri/java/`, spoken to over stdio). The runtime and
# the driver jar are `jlink`-trimmed into the bundle by `scripts/build-iris-runtime.mjs` — still
# nothing for the user to install, and nothing here for cargo to build.
#
# Postgres covers Supabase too — a Supabase project *is* a Postgres instance, so the only
# difference is which host/port/SSL defaults the connection form fills in.
tokio-postgres = "0.7"
# Postgres over TLS. `ring` (not aws-lc-rs) to match the provider `rustls` above resolves, and
# both root sources because the two deployments differ: a hosted database (Supabase, RDS) is
# signed by a public CA that `webpki-roots` carries, while a self-hosted one is usually signed by
# a company CA that only the OS store knows about.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = [
    "ring",
    "native-certs",
    "webpki-roots",
] }
# SQL Server speaks TDS, which nothing else here can carry. `default-features = false` drops
# tiberius's native-tls default (it would want OpenSSL on Linux); `sql-browser-tokio` is what
# resolves a named instance (`HOST\SQLEXPRESS`) to its dynamic port over the SQL Browser service.
tiberius = { version = "0.12", default-features = false, features = [
    "tds73",
    "rustls",
    "chrono",
    "sql-browser-tokio",
] }
# tiberius is runtime-agnostic and wants a futures-io stream; this adapts tokio's TcpStream.
# `io` alongside `compat`: the cloud transports download through `StreamReader`, which turns
# reqwest's chunk stream into the `AsyncRead` that `files::pump` — and therefore the one progress
# bar every transport shares — is written against.
tokio-util = { version = "0.7", features = ["compat", "io"] }
# `default-features = false` to keep the optional KMS/compression backends out, but three features
# are not optional in practice: `bson-2` is the document type the whole API is written in (with no
# bson feature the crate compiles and exposes almost nothing), `dns-resolver` is what resolves a
# `mongodb+srv://` URI — the only form Atlas hands out — and `rustls-tls` avoids an OpenSSL
# dependency on Linux.
mongodb = { version = "3", default-features = false, features = [
    "bson-2",
    # The crate refuses to compile without this: it is the marker that says the calling code was
    # written against the 3.3 API, so a future minor release can change defaults without breaking us.
    "compat-3-3-0",
    "dns-resolver",
    "rustls-tls",
] }
tauri-plugin-single-instance = "2.4.3"

# ---------------- Remote control (phone / tablet on the same network) ----------------
# The first *server* in this binary. Everything else that binds a port here is an ephemeral
# localhost socket serving one client for one exchange — the OAuth callback (`oauth.rs`), the DAP
# adapter (`debugger.rs`), an SSH forward (`remotes/forward.rs`) — whereas this one listens on the
# LAN, for as long as the user leaves it on, for clients it has never met. That difference is why
# it gets a real HTTP stack instead of a hand-rolled read loop: content negotiation, range requests
# for the static bundle, and correct WebSocket framing are all things a phone browser will exercise
# and none of them are worth writing twice.
#
# `axum` over `warp`/`actix` because it is `hyper` + `tower` with no runtime of its own — it uses
# the tokio already here — and because `tower-http` is the same crate family, so the static-file
# service below is not a second vendor's idea of a middleware.
#
# `ws` is not a default feature and is the whole point of the event channel; `macros` gives the
# `#[debug_handler]` attribute that turns axum's famously opaque "handler does not implement
# Handler" into a line number.
axum = { version = "0.8", features = ["ws", "macros"] }
# `fs` alone: `ServeDir`/`ServeFile` for the mobile bundle. Deliberately no `cors` — the mobile
# client is served from this same origin, so there is no cross-origin request to allow, and a
# permissive layer here would let any web page the user happens to visit reach the pairing
# endpoint. See `remotectl/server.rs`.
#
# `set-header` is what lets the two halves of that bundle be cached differently: the hashed assets
# forever, the entry document never. Without it a phone holds a stale `index.html` pointing at
# chunk names that no longer exist, which is a white screen rather than an old UI.
tower-http = { version = "0.6", features = ["fs", "set-header"] }
# Only for `ServiceBuilder`, to stack those header layers onto the two static services without
# layering them onto the API routes as well. Already in the tree as axum's own foundation, so this
# is a name, not a dependency.
tower = "0.5"
russh-sftp = "2.4.0"
# FTP/FTPS — the one file transport that is *not* a subsystem of the user's `ssh`, so unlike
# `russh-sftp` this crate owns its socket. `tokio-rustls-ring` rather than any native-tls or
# aws-lc-rs variant for the reason `rustls` above gives: a second crypto provider in the binary is
# a runtime "no process-level CryptoProvider available" away from breaking every other TLS caller.
# `deprecated` is only there for `connect_secure_implicit` — implicit FTPS (port 990) is what the
# RFC deprecated, not the binding, and it is still what a decade-old appliance answers on.
suppaftp = { version = "10", default-features = false, features = [
    "tokio-rustls-ring",
    "deprecated",
] }
# suppaftp's `AsyncRustlsConnector` is only constructible `From<tokio_rustls::TlsConnector>`, and it
# re-exports neither the type nor a builder — so the crate has to be named here to hand it one.
# Pinned to the version suppaftp itself resolves: two `tokio-rustls` majors in the tree would make
# the `From` impl take a `TlsConnector` that is not the one this code builds.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The resolver the MongoDB driver already bundles, named directly so `datasource::srv` can build one
# from the nameservers this machine actually has. Pinned to the version the driver resolves: two
# copies in the tree would be two DNS stacks, and the point of this is to use the same one the
# driver would have used if it could read the system config. See `datasource/srv.rs` for why it
# often can't.
hickory-resolver = "0.26"

# `keyring` ships with no OS credential-store backend enabled by default — without one
# of these, Entry::set_password()/get_password() silently round-trip through a
# non-persistent stub (writes "succeed", reads come back empty).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# `ICoreWebView2_19::SetMemoryUsageTargetLevel`, so that closing the window to the tray tells
# WebView2 to release the caches it is holding for a window nobody can see (see
# `set_webview_memory_target` in `lib.rs`). Both crates are already in the tree — wry depends on
# webview2-com, which depends on windows-core — so naming them here only makes them ours to call
# and compiles nothing new.
webview2-com = "0.38"
windows-core = "0.61"
# `GetProcessMemoryInfo` with `PROCESS_MEMORY_COUNTERS_EX2`, so the panel behind the status bar bills
# this app for the same private working set Task Manager shows in its own rows — see
# `sysload::footprint` for why the resident size sysinfo hands out cannot be reconciled with it. Also
# already in the tree (tauri, sysinfo and keyring all reach for it), so this names three modules and
# compiles nothing that was not being compiled.
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# The universal-apple-darwin release build cross-compiles the x86_64 slice on an
# aarch64 GitHub runner; git2's default OpenSSL backend then fails to find a
# matching OpenSSL via pkg-config for the non-host target ("could not find
# directory of OpenSSL installation"). Scoped to macOS only (not Windows/Linux)
# so local dev builds don't need Perl/NASM to build OpenSSL from source.
git2 = { version = "0.19", features = ["vendored-openssl"] }

