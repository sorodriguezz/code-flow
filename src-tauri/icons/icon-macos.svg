<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="CodeFlow">
  <title>CodeFlow</title>
  <!-- The macOS / home-screen icon: the mark lit on a night-blue tile. Full-bleed on purpose —
       macOS 26+ applies its own squircle mask, and a margin here would be read as a legacy icon.
       icon.icns is generated from this file (see icon.svg for the rest of the set), and so are
       icon-macos-source.png and icon-pwa.png. -->
  <defs>
    <linearGradient id="cf-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1F3F"/>
      <stop offset="1" stop-color="#0B0C19"/>
    </linearGradient>
    <radialGradient id="cf-dawn" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cf-flow" gradientUnits="userSpaceOnUse" x1="254.4" y1="512" x2="769.6" y2="512"><stop offset="0" stop-color="#C4B5FD"/><stop offset="0.5" stop-color="#818CF8"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <filter id="cf-halo" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="20.2"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#cf-night)"/>
  <rect width="1024" height="1024" fill="url(#cf-dawn)"/>
  <path d="M431 317 L282 481.6 Q254.4 512 282 542.4 L405.3 679.4 Q431 707 445.8 672.1 L578.2 351.9 Q593 317 618.7 345.5 L742 481.6 Q769.6 512 742 542.4 L593 707" fill="none" stroke="#6366F1" stroke-opacity="0.55" stroke-width="110.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#cf-halo)"/>
  <path d="M431 317 L282 481.6 Q254.4 512 282 542.4 L405.3 679.4 Q431 707 445.8 672.1 L578.2 351.9 Q593 317 618.7 345.5 L742 481.6 Q769.6 512 742 542.4 L593 707" fill="none" stroke="url(#cf-flow)" stroke-width="84.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
